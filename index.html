<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Seu diário pessoal de cinema." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=12" />
    <style>
      .brand { font-size: 0 !important; display: inline-flex !important; align-items: center; }
      .topbar .brand { width: 150px; height: 78px; justify-content: center; padding: 0; line-height: 0; flex: 0 0 150px; }
      .brand span { display: none !important; }
      .brand::before { display: none !important; }
      .brand-logo { display: block; width: 150px; height: 60px; object-fit: contain; }
      .topbar .brand-logo { width: 150px; height: 48px; object-position: center; margin: 0 auto; }
      .auth-brand .brand-logo { width: 164px; height: 66px; }
      .entry-art span { display: none !important; }
      .entry-art::before { display: none !important; }
      .entry-art { background: linear-gradient(145deg, #f4f0e9, #d9d1c7) !important; box-shadow: 28px 28px 0 #a99e95 !important; }
      .entry-art-logo { display: block; width: 58%; height: 58%; object-fit: contain; transform: rotate(7deg); }
      .api-key-field { display: grid; gap: 7px; color: #b8b5b7; font-size: 11px; margin: 16px 0; }
      .api-key-field span { display: flex; justify-content: space-between; }
      .api-key-field small { color: #77747a; font-size: 10px; }
      .api-key-field input { background: #151519; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; padding: 13px; color: #fff; outline: 0; }
      .section-heading .primary { color: #161519 !important; background: #f0eeea !important; }
      #cinema-url-form { display: grid !important; grid-template-columns: minmax(0, 1fr) auto !important; gap: 10px !important; align-items: stretch !important; }
      #cinema-url-form input { width: 100% !important; min-height: 44px !important; background: #151519 !important; border: 1px solid #4a454b !important; border-radius: 8px !important; padding: 0 14px !important; color: #f6f4f1 !important; font: 12px Inter, sans-serif !important; outline: none !important; }
      #cinema-url-form input::placeholder { color: #858087 !important; }
      #cinema-url-form input:focus { border-color: #e66c60 !important; box-shadow: 0 0 0 3px rgba(230,108,96,.14) !important; }
      #cinema-url-form button { min-height: 44px !important; border: 0 !important; border-radius: 22px !important; padding: 0 18px !important; background: #f0eeea !important; color: #161519 !important; font: 700 11px Inter, sans-serif !important; white-space: nowrap !important; }
      @media (max-width: 760px) { .topbar .brand { width: 150px; height: 61px; flex-basis: 150px; } }
      @media (max-width: 560px) { #cinema-url-form { grid-template-columns: 1fr !important; } }
    </style>
    <title>MyTake — seu cinema, do seu jeito</title>
  </head>
  <body>
    <script>
      if (new URLSearchParams(location.search).has('new')) {
        ['cineroll-data-v1','mytake-user','mytake-session','mytake-tmdb-token','mytake-playlist','mytake-login-day','mytake-login-streak','mytake-seen-rewards','mytake-news-day','mytake-news-count'].forEach(key => localStorage.removeItem(key));
        history.replaceState({}, '', location.pathname);
      }
    </script>
    <div id="app"></div>
    <script type="module" src="./src/app.js?v=37"></script>
    <script>
      const replaceLegacyBrand = () => document.querySelectorAll('.brand, .entry-art').forEach(brand => {
        const legacyMark = brand.querySelector('span:first-child');
        if (legacyMark) {
          const logo = document.createElement('img');
          logo.src = brand.matches('.entry-art') ? './fonts/logo-myticket-black.png' : './fonts/logo-myticket-white.png';
          logo.alt = 'MyTake';
          logo.className = brand.matches('.entry-art') ? 'entry-art-logo' : 'brand-logo';
          legacyMark.replaceWith(logo);
        }
      });
      replaceLegacyBrand();
    </script>
    <script>
      const addTmdbLoginOption = () => document.querySelectorAll('#login-form, #register-form').forEach(form => {
        if (form.querySelector('.api-key-field')) return;
        const field = document.createElement('label');
        field.className = 'api-key-field';
        field.innerHTML = '<span>API TMDB <small>opcional</small></span><input type="password" name="tmdbToken" placeholder="Cole seu Read Access Token" autocomplete="off">';
        form.insertBefore(field, form.querySelector('.auth-submit'));
        const input = field.querySelector('input');
        input.value = localStorage.getItem('mytake-tmdb-token') || '';
        form.addEventListener('submit', () => { if (input.value.trim()) localStorage.setItem('mytake-tmdb-token', input.value.trim()); });
      });
      addTmdbLoginOption();
    </script>
    <script>
      document.addEventListener('keyup', event => {
        if (event.key === 'Enter' && event.target.matches('#global-search') && event.target.value.trim()) {
          event.preventDefault();
          const query=event.target.value.trim();
          document.querySelector('[data-action="add"]')?.click();
          setTimeout(()=>{const form=document.querySelector('#tmdb-search'),input=form?.querySelector('input');if(form&&input){input.value=query;form.requestSubmit()}},0);
        }
      });
      const smoothGlobalSearch = () => { const input=document.querySelector('#global-search'); if(!input||!document.querySelector('.movie-grid')||input.dataset.smoothSearch)return; input.dataset.smoothSearch='true'; input.oninput=()=>{const query=input.value.trim().toLowerCase();document.querySelectorAll('.movie-tile').forEach(tile=>{tile.style.display=tile.textContent.toLowerCase().includes(query)?'':'none'});}; };
      smoothGlobalSearch();
      document.addEventListener('input',event=>{if(event.target.matches('#global-search')&&document.querySelector('.movie-grid')){event.stopImmediatePropagation();const query=event.target.value.trim().toLowerCase();document.querySelectorAll('.movie-tile').forEach(tile=>{tile.style.display=tile.textContent.toLowerCase().includes(query)?'':'none'})}},true);
    </script>
    <style>
      .login-streak{display:inline-flex;align-items:center;gap:4px;color:#f2b35f;font-size:11px;font-weight:700;white-space:nowrap}.login-streak b{font-size:15px}.login-streak small{color:#aaa;font-size:9px;font-weight:500}@media(max-width:760px){.login-streak small{display:none}}
      .reward-toast{position:fixed;right:24px;bottom:24px;z-index:45;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:min(370px,calc(100vw - 32px));padding:14px 16px;background:#19171d;border:1px solid #d59a62;box-shadow:0 18px 60px #000b;animation:reward-pop .5s cubic-bezier(.2,.9,.2,1)}.reward-toast-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:23px;background:linear-gradient(135deg,#e66c60,#e8c56a,#7da9e8,#c58be8);color:#171519}.reward-toast p{margin:0;color:#e8b273;font:500 9px 'DM Mono';letter-spacing:1.3px}.reward-toast b{display:block;font:22px Delight;margin-top:3px}.reward-toast button{color:#aaa;font-size:20px}@keyframes reward-pop{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}@media(max-width:760px){.reward-toast{right:16px;bottom:82px}}
    </style>
    <script>
      const cinemaMarkup = '<main class="inner cinema-page"><div class="page-intro"><p>SALA DE EXIBIÇÃO</p><h1>Cinema.</h1><span>Assista a arquivos locais ou a links diretos de mídia autorizados.</span></div><section class="cinema-player"><video id="cinema-video" controls playsinline></video><div class="cinema-empty"><b>Seu player pessoal</b><span>Escolha um arquivo ou cole uma URL direta de vídeo.</span></div></section><section class="cinema-controls"><label class="cinema-upload">Abrir arquivo local<input id="cinema-file" type="file" accept="video/*,audio/*"></label><form id="cinema-url-form"><input id="cinema-url" type="url" placeholder="https://exemplo.com/video.mp4" required><button type="submit">Reproduzir link</button></form><small>O app não varre sites nem extrai fontes. Use apenas arquivos e links que você tem autorização para reproduzir.</small></section></main>';
      const showCinema = () => { const main=document.querySelector('#app main'); if(!main)return; main.outerHTML=cinemaMarkup; bindCinema(); };
      const bindCinema = () => { const video=document.querySelector('#cinema-video'), empty=document.querySelector('.cinema-empty'), file=document.querySelector('#cinema-file'), form=document.querySelector('#cinema-url-form'); if(!video||!file||!form)return; const play=src=>{video.src=src;video.style.display='block';empty.style.display='none';video.play().catch(()=>{})}; file.onchange=()=>{const selected=file.files?.[0];if(selected)play(URL.createObjectURL(selected))};form.onsubmit=event=>{event.preventDefault();play(document.querySelector('#cinema-url').value.trim())}; };
      const installCinemaNav = () => document.querySelectorAll('.topbar nav,.bottom-nav').forEach(nav=>{if(nav.querySelector('[data-cinema]'))return;const button=document.createElement('button');button.dataset.cinema='true';button.textContent='Cinema';button.onclick=showCinema;nav.append(button)});
      const showNews = () => {const key=new Date().toISOString().slice(0,10), count=Number(localStorage.getItem('mytake-news-count')||0), day=localStorage.getItem('mytake-news-day');if(day!==key){localStorage.setItem('mytake-news-day',key);localStorage.setItem('mytake-news-count','0')}if(count>=2||document.querySelector('.news-modal')||!document.querySelector('.topbar'))return;localStorage.setItem('mytake-news-count',String(count+1));const modal=document.createElement('div');modal.className='news-modal';modal.innerHTML='<section class="news-card"><button class="news-close" aria-label="Fechar">×</button><p class="eyebrow">NOVIDADES DO MYTAKE</p><h2>Uma nova sessão começa aqui.</h2><p>O Cinema agora aceita arquivos locais e links diretos de mídia. Também estamos preparando melhorias na biblioteca, nas recompensas e na experiência em dispositivos móveis.</p></section>';modal.querySelector('.news-close').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};document.body.append(modal)};
      const uiObserver={};
    </script>
    <script>
      let musicTracks=[];let musicIndex=-1;let musicUrls=[];
      const musicMarkup='<main class="inner music-page"><div class="page-intro"><p>SESSÃO DE ÁUDIO</p><h1>Música.</h1><span>Uma sala privada para suas faixas locais.</span></div><section class="music-panel"><div class="music-now"><div><p class="eyebrow">TOCANDO AGORA</p><h2 id="music-title">Nenhuma faixa selecionada</h2><p id="music-status">Adicione músicas locais para começar.</p></div><audio id="music-audio" controls></audio></div><div class="music-actions"><label class="music-upload">Adicionar músicas locais<input id="music-files" type="file" accept="audio/*" multiple></label><button class="music-save" id="music-save" type="button">Salvar playlist</button></div><div class="music-list" id="music-list"></div><p class="music-note">Os arquivos não são enviados. A playlist salva apenas nomes e ordem no navegador; por segurança, selecione os arquivos novamente se abrir em outro dispositivo ou limpar os dados do site.</p></section></main>';
      const renderMusicList=()=>{const list=document.querySelector('#music-list');if(!list)return;list.innerHTML=musicTracks.map((track,index)=>`<div class="music-track ${index===musicIndex?'active':''}"><button data-music-play="${index}" aria-label="Tocar ${track.name}">${index===musicIndex?'▶':'▷'}</button><span><b>${track.name}</b><small>${track.file?'Arquivo local':'Salvo na playlist'}</small></span><button data-music-remove="${index}" aria-label="Remover ${track.name}">×</button></div>`).join('')||'<p class="music-note">Nenhuma faixa adicionada.</p>';list.querySelectorAll('[data-music-play]').forEach(button=>button.onclick=()=>playMusic(+button.dataset.musicPlay));list.querySelectorAll('[data-music-remove]').forEach(button=>button.onclick=()=>{const index=+button.dataset.musicRemove;if(musicUrls[index])URL.revokeObjectURL(musicUrls[index]);musicTracks.splice(index,1);musicUrls.splice(index,1);musicIndex=-1;renderMusicList()})};
      const playMusic=index=>{const track=musicTracks[index];if(!track)return;musicIndex=index;const audio=document.querySelector('#music-audio');if(track.file){const url=musicUrls[index]||URL.createObjectURL(track.file);musicUrls[index]=url;audio.src=url}else{audio.removeAttribute('src')}document.querySelector('#music-title').textContent=track.name;document.querySelector('#music-status').textContent=track.file?'Arquivo local':'Selecione o arquivo novamente para tocar';audio.onended=()=>{if(musicIndex<musicTracks.length-1)playMusic(musicIndex+1)};renderMusicList();audio.play().catch(()=>{})};
      const showMusic=()=>{const main=document.querySelector('#app main');if(!main)return;main.outerHTML=musicMarkup;const saved=JSON.parse(localStorage.getItem('mytake-playlist')||'[]');musicTracks=saved.map(name=>({name,file:null}));musicUrls=[];musicIndex=-1;document.querySelector('#music-files').onchange=event=>{[...event.target.files].forEach(file=>musicTracks.push({name:file.name,file}));renderMusicList()};document.querySelector('#music-save').onclick=()=>{localStorage.setItem('mytake-playlist',JSON.stringify(musicTracks.map(track=>track.name)));document.querySelector('#music-status').textContent='Playlist salva neste navegador.'};renderMusicList()};
      const installMusicNav=()=>document.querySelectorAll('.nav-tools').forEach(tools=>{if(tools.querySelector('[data-music]'))return;const button=document.createElement('button');button.dataset.music='true';button.className='music-nav-button';button.type='button';button.title='Abrir player de músicas';button.textContent='♫';button.onclick=showMusic;tools.insertBefore(button,tools.querySelector('.avatar'))});
      const musicObserver={};
    </script>
    <script>
      const removeRetiredFeatures=()=>document.querySelectorAll('.cinema-page,.music-page').forEach(element=>element.remove());
      removeRetiredFeatures();
      const localDay=()=>{const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`};
      const updateLoginStreak=()=>{if(!localStorage.getItem('mytake-session'))return;const today=localDay(),last=localStorage.getItem('mytake-login-day'),current=Number(localStorage.getItem('mytake-login-streak')||0);if(last===today)return current;const previous=new Date();previous.setDate(previous.getDate()-1);const yesterday=`${previous.getFullYear()}-${String(previous.getMonth()+1).padStart(2,'0')}-${String(previous.getDate()).padStart(2,'0')}`;const streak=last===yesterday?current+1:1;localStorage.setItem('mytake-login-day',today);localStorage.setItem('mytake-login-streak',String(streak));return streak};
      const showStreakCard=()=>{document.querySelector('.streak-card')?.remove();const streak=Math.max(1,Number(localStorage.getItem('mytake-login-streak')||0)),card=document.createElement('section');card.className=`streak-card ${streak>=7?'streak-blue':''}`;card.innerHTML=`<button class="streak-close">×</button><span class="streak-flame">🔥</span><p>SEQUÊNCIA DE CINEMA</p><h2>${streak} ${streak===1?'dia':'dias'}</h2><div class="streak-days">${[1,2,3,4,5,6,7].map(day=>`<i class="${day<=streak?'done':''}">${day}</i>`).join('')}</div><small>${streak>=7?'Você completou uma semana. O fogo azul foi desbloqueado.':`Faltam ${7-streak} dias para desbloquear o fogo azul.`}</small>`;card.querySelector('.streak-close').onclick=()=>card.remove();document.body.append(card)};
      const installStreak=()=>{const tools=document.querySelector('.nav-tools');if(!tools||tools.querySelector('.login-streak'))return;const streak=Number(localStorage.getItem('mytake-login-streak')||0),badge=document.createElement('button');badge.className='login-streak';badge.type='button';badge.title='Abrir sequência';badge.innerHTML=`<b>${streak>=7?'🔥':'🔥'}</b><span>${streak}</span><small>${streak===1?'dia':'dias'}</small>`;badge.onclick=showStreakCard;tools.insertBefore(badge,tools.querySelector('[data-music]')||tools.querySelector('.avatar'))};
      const refreshStreak=()=>{const badge=document.querySelector('.login-streak');if(!badge)return;const streak=Number(localStorage.getItem('mytake-login-streak')||0);badge.title=`Sequência de ${streak} dia${streak===1?'':'s'}`;badge.innerHTML=`<b>🔥</b><span>${streak}</span><small>${streak===1?'dia':'dias'}</small>`};
      globalThis.recordStreakActivity=()=>{if(!localStorage.getItem('mytake-session'))return 0;const today=localDay(),last=localStorage.getItem('mytake-login-day'),current=Number(localStorage.getItem('mytake-login-streak')||0);if(last===today&&current>0){refreshStreak();return current}const previous=new Date();previous.setDate(previous.getDate()-1);const yesterday=`${previous.getFullYear()}-${String(previous.getMonth()+1).padStart(2,'0')}-${String(previous.getDate()).padStart(2,'0')}`;const streak=last===yesterday?current+1:1;localStorage.setItem('mytake-login-day',today);localStorage.setItem('mytake-login-streak',String(streak));refreshStreak();return streak};
      document.addEventListener('mytake-render',installStreak);installStreak();
      document.addEventListener('submit',event=>{if(event.target.matches('#login-form,#register-form'))setTimeout(()=>{if(localStorage.getItem('mytake-session'))globalThis.recordStreakActivity()},0)},true);
      document.addEventListener('click',event=>{const target=event.target.closest?.('[data-import],[data-toggle="watched"]');if(target)setTimeout(()=>globalThis.recordStreakActivity(),0)},true);
      document.addEventListener('change',event=>{if(event.target.matches('[data-field]'))setTimeout(()=>globalThis.recordStreakActivity(),0)},true);
    </script>
    <script>
      const celebrateRewards=()=>{const cards=[...document.querySelectorAll('.reward-card.unlocked')];if(!cards.length)return;const unlocked=cards.map(card=>card.querySelector('h2')?.textContent).filter(Boolean),seen=JSON.parse(localStorage.getItem('mytake-seen-rewards')||'[]'),fresh=unlocked.filter(title=>!seen.includes(title));localStorage.setItem('mytake-seen-rewards',JSON.stringify(unlocked));if(!fresh.length||document.querySelector('.reward-toast'))return;const toast=document.createElement('div');toast.className='reward-toast';toast.innerHTML=`<div class="reward-toast-icon">✧</div><div><p>CONQUISTA DESBLOQUEADA</p><b>${fresh[0]}</b></div><button aria-label="Fechar">×</button>`;toast.querySelector('button').onclick=()=>toast.remove();document.body.append(toast);setTimeout(()=>toast.remove(),7000)};
      celebrateRewards();
    </script>
  </body>
</html>
